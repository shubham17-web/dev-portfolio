
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | DevPortfolio</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .admin-login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .admin-login-card {
            width: 100%;
            max-width: 420px;
            padding: 36px;
            border: 1px solid rgba(108, 74, 182, 0.2);
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(16px);
            box-shadow: 0 16px 45px rgba(43, 37, 64, 0.12);
        }

        .admin-login-card h1 {
            color: #2B2540;
            margin-bottom: 8px;
        }

        .admin-login-card p {
            color: #4B3390;
            margin-bottom: 24px;
        }

        .admin-login-card label {
            display: block;
            margin: 16px 0 8px;
            color: #2B2540;
            font-weight: 600;
        }

        .admin-login-card input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d8d0e8;
            border-radius: 10px;
            font: inherit;
            color: #2B2540;
            background: #fff;
        }

        .admin-login-card input:focus {
            outline: 2px solid #6C4AB6;
            outline-offset: 2px;
        }

        .admin-login-card button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #6C4AB6;
            color: #fff;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        .admin-login-card button:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        #login-status {
            margin-top: 16px;
            font-size: 0.92rem;
            overflow-wrap: anywhere;
        }

        .back-link {
            display: inline-block;
            margin-top: 22px;
            color: #4B3390;
            text-decoration: none;
        }

        @media (max-width: 480px) {
            .admin-login-card {
                padding: 26px 20px;
            }
        }
    </style>
</head>
<body>
    <main class="admin-login-page">
        <section class="admin-login-card">
            <h1>Admin Login</h1>
            <p>Sign in to manage your portfolio messages.</p>

            <form id="admin-login-form">
                <label for="username">Username</label>
                <input
                    id="username"
                    name="username"
                    type="text"
                    autocomplete="username"
                    maxlength="100"
                    required
                >

                <label for="password">Password</label>
                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    maxlength="200"
                    required
                >

                <button id="login-button" type="submit">
                    Sign In
                </button>

                <p id="login-status" role="status" aria-live="polite"></p>
            </form>

            <a class="back-link" href="../index.html">
                ← Back to Portfolio
            </a>
        </section>
    </main>

    <script src="login.js"></script>
</body>
</html>
